<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Πρωτότυπο Β · Οδική σήμανση</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;500;700&display=swap">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<style>
  /* Greek road signs: blue boards, Greek in yellow, Latin in white, a white inset border; motorways are green */
  :root { --blue: #0b4ea2; --blue2: #083b7c; --green: #0a7a43; --yellow: #ffd60a; --white: #fff; --red: #d0021b; --asphalt: #23262b; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font: 15px/1.3 "Roboto Condensed", "Arial Narrow", sans-serif; background: #dfe3e6; color: var(--asphalt); }
  #app { display: grid; grid-template-columns: 372px 1fr; height: 100%; }
  #side { background: var(--asphalt); padding: 12px; display: flex; flex-direction: column; gap: 10px; min-height: 0; }
  .board { background: var(--blue); color: var(--white); border-radius: 12px; padding: 5px; }
  .board > .in { border: 2.5px solid var(--white); border-radius: 8px; padding: 12px 14px; }
  .board.green { background: var(--green); }
  .gr { color: var(--yellow); font-weight: 700; font-size: 25px; line-height: 1.08; letter-spacing: .01em; }
  .lat { font-weight: 500; font-size: 15px; margin-top: 3px; letter-spacing: .03em; }
  .counts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .counts .in { padding: 8px 12px; display: flex; align-items: center; gap: 10px; }
  .roundel { flex: none; width: 46px; height: 46px; border-radius: 50%; background: #fff; border: 6px solid var(--red); color: #111; display: grid; place-items: center; font-weight: 700; font-size: 17px; }
  .roundel.ai { border: 0; background: #fff; color: var(--blue); width: 40px; height: 40px; border-radius: 6px; font-size: 16px; }
  .counts .gr { font-size: 15px; } .counts .lat { font-size: 12.5px; margin: 0; }
  #list { flex: 1; min-height: 0; overflow-y: auto; border-radius: 12px; background: var(--blue); padding: 5px; scrollbar-color: #fff3 transparent; }
  #list .in { border: 2.5px solid #fff; border-radius: 8px; }
  .it { display: grid; grid-template-columns: 34px 1fr; gap: 10px; align-items: center; width: 100%; text-align: left; background: none; border: 0; border-bottom: 1.5px solid #ffffff55; padding: 8px 12px; color: #fff; font: inherit; cursor: pointer; }
  .it:hover { background: var(--blue2); }
  .it .rd { width: 32px; height: 32px; border-radius: 50%; background: #fff; border: 4px solid var(--red); color: #111; display: grid; place-items: center; font-weight: 700; font-size: 14px; }
  .it .nm { color: var(--yellow); font-weight: 700; font-size: 15.5px; }
  .it .ar { font-size: 13px; letter-spacing: .02em; }
  #map { height: 100%; }
  .maplibregl-popup-content { background: var(--blue); color: #fff; border-radius: 10px; padding: 5px; font: 14px/1.3 "Roboto Condensed", sans-serif; box-shadow: 0 6px 18px #0005; max-width: 280px; }
  .pop { border: 2px solid #fff; border-radius: 7px; padding: 9px 12px; }
  .pop .k { font-size: 12px; letter-spacing: .03em; opacity: .9; }
  .pop h3 { color: var(--yellow); margin: 3px 0 5px; font-size: 17px; }
  .pop .flows { opacity: .92; margin-top: 3px; }
  .maplibregl-popup-tip { border-top-color: var(--blue) !important; border-bottom-color: var(--blue) !important; }
  .maplibregl-popup-close-button { color: #fff; right: 8px; top: 8px; }
</style>
</head>
<body>
<div id="app">
  <aside id="side">
    <div class="board"><div class="in">
      <div class="gr">Κάμερες στους δρόμους της Αττικής</div>
      <div class="lat">Road cameras in Attica</div>
    </div></div>
    <div class="counts">
      <div class="board"><div class="in"><div class="roundel" id="tot"></div><div><div class="gr">Ερυθρού σηματοδότη</div><div class="lat">Red-light · <span id="nj"></span> κόμβοι</div></div></div></div>
      <div class="board green"><div class="in"><div class="roundel ai">AI</div><div><div class="gr">Τεχνητής Νοημοσύνης</div><div class="lat">AI · 8 σημεία</div></div></div></div>
    </div>
    <div id="list"><div class="in" id="rows"></div></div>
  </aside>
  <div id="map"></div>
</div>
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="../data.js"></script>
<script src="common.js"></script>
<script>
document.getElementById("tot").textContent = TOTAL;
document.getElementById("nj").textContent = JUNCTIONS.length;
document.getElementById("rows").innerHTML = [...JUNCTIONS].sort((a, b) => a.aa[0] - b.aa[0]).map(j =>
  `<button class="it" data-id="${j.id}"><span class="rd">${j.cameras}</span><span><div class="nm">${esc(j.location)}</div><div class="ar">${esc(j.area)} · ${COVER[j.coverage]}</div></span></button>`).join("");

(async () => {
  const style = await themedStyle("positron", {
    land: "#eceeed", land2: "#e6e9e8", water: "#b9d3e6", green: "#d5e6d3", building: "#dcdfde", buildingLine: "#cfd3d2",
    casing: "#b8bdbd", motorway: "#0a7a43", major: "#ffffff", minor: "#ffffff", rail: "#c5c9c9", boundary: "#c5c9c9",
    label: "#5a6068", place: "#23262b", halo: "#ffffff", font: "Noto Sans Bold"
  }, [/shield/, /airport/]);
  const map = await makeMap(style);
  const popup = new maplibregl.Popup({ offset: 16 });
  const fade = ["interpolate", ["linear"], ["zoom"], 15, 1, 15.8, ["case", ["get", "has"], 0, 1]];
  const rad = ["interpolate", ["linear"], ["zoom"], 9, ["+", 5, ["*", .45, ["get", "n"]]], 14, ["+", 10, ["*", .7, ["get", "n"]]]];
  const ring = ["interpolate", ["linear"], ["zoom"], 9, 2.2, 14, 4.5];
  map.addLayer({ id: "cone", type: "fill", source: "cones", minzoom: 15, paint: { "fill-color": "#d0021b", "fill-opacity": .22 } });
  map.addLayer({ id: "cone-l", type: "line", source: "cones", minzoom: 15, paint: { "line-color": "#d0021b", "line-width": 1.2 } });
  map.addLayer({ id: "cam", type: "circle", source: "cams", minzoom: 15, paint: { "circle-radius": 5, "circle-color": "#fff", "circle-stroke-color": "#d0021b", "circle-stroke-width": 3 } });
  // junctions drawn as prohibition-sign roundels: white disc, red ring, black number
  map.addLayer({ id: "j", type: "circle", source: "junctions", paint: { "circle-radius": rad, "circle-color": "#fff", "circle-opacity": fade,
    "circle-stroke-color": ["case", ["get", "approx"], "#8a8f96", "#d0021b"], "circle-stroke-width": ring, "circle-stroke-opacity": fade } });
  map.addLayer({ id: "j-n", type: "symbol", source: "junctions", layout: { "text-field": ["to-string", ["get", "n"]], "text-font": ["Noto Sans Bold"],
    "text-size": ["interpolate", ["linear"], ["zoom"], 9, 9, 14, 14], "text-allow-overlap": true }, paint: { "text-color": "#111", "text-opacity": fade } });
  // AI sites as blue mandatory-sign discs
  map.addLayer({ id: "ai", type: "circle", source: "ai", paint: { "circle-radius": 10, "circle-color": "#0b4ea2", "circle-stroke-color": "#fff", "circle-stroke-width": 2, "circle-translate": [14, -14] } });
  map.addLayer({ id: "ai-n", type: "symbol", source: "ai", layout: { "text-field": "AI", "text-font": ["Noto Sans Bold"], "text-size": 10, "text-allow-overlap": true, "text-ignore-placement": true },
    paint: { "text-color": "#fff", "text-translate": [14, -14] } });
  wireClicks(map, popup, "j", "ai");
  fit(map, 60);
  document.getElementById("rows").addEventListener("click", e => { const b = e.target.closest(".it"); if (b) flyToJunction(map, popup, b.dataset.id); });
})();
</script>
</body>
</html>
