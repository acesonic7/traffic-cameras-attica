<style>
  :root {  /* dark sheet (default) */

        aboutBody: "<p class=\"lead\">Σε μια δημοκρατική κοινωνία, οι πολίτες έχουν δικαίωμα να γνωρίζουν τουλάχιστον πού και πότε επιτηρούνται.</p><p>Αυτός ο χάρτης δημιουργήθηκε για να κάνει την πληροφορία αυτή προσβάσιμη σε όλους. Απευθύνεται σε όσους ζουν και μετακινούνται στην Αττική και θέλουν να γνωρίζουν πού έχουν εγκατασταθεί κάμερες, ώστε να μπορούν να ενημερώνονται, να θέτουν ερωτήματα, να ελέγχουν τη λειτουργία τους και να ασκούν τα δικαιώματά τους.</p><p>Σκοπός του δεν είναι να υποστηρίξει ή να απορρίψει τη χρήση καμερών στους δρόμους, ούτε να διευκολύνει την αποφυγή τους. Σκοπός του είναι η διαφάνεια και η πρόσβαση στην πληροφορία.</p><h3>Δύο διαφορετικά συστήματα</h3><p><b>Κάμερες παραβίασης ερυθρού σηματοδότη · Περιφέρεια Αττικής</b><br>Το σύστημα περιλαμβάνει 388 κάμερες σε 97 σηματοδοτούμενους κόμβους, σε θέσεις που καθορίστηκαν από τη Διεύθυνση Τροχαίας Αττικής. Σύμφωνα με την Περιφέρεια, οι κάμερες καταγράφουν αποκλειστικά παραβιάσεις ερυθρού σηματοδότη και αποστέλλουν στην Τροχαία έξι φωτογραφίες και ένα βίντεο ανά καταγεγραμμένη παράβαση, με μέτρα προστασίας ώστε να μη διακρίνονται οι επιβαίνοντες. Κάθε κάμερα διαθέτει φακό αναγνώρισης πινακίδων (ANPR) και φακό γενικής λήψης, ενώ το σύστημα μπορεί να αναγνωρίζει την πινακίδα κυκλοφορίας, τη μάρκα, το χρώμα και την κατηγορία του οχήματος.</p><p><b>Κάμερες Τεχνητής Νοημοσύνης · Υπουργείο Ψηφιακής Διακυβέρνησης και Τεχνητής Νοημοσύνης</b><br>Πρόκειται για πιλοτικό σύστημα σε οκτώ σημεία της Αττικής. Σύμφωνα με το Υπουργείο, οι κάμερες μπορούν να εντοπίζουν παραβιάσεις ερυθρού σηματοδότη, υπερβάσεις ορίου ταχύτητας, παράνομη κίνηση ή στάση σε λεωφορειολωρίδες, μη χρήση ζώνης ασφαλείας ή κράνους και χρήση κινητού τηλεφώνου κατά την οδήγηση. Οι σχετικές κλήσεις αποστέλλονται ψηφιακά στη Θυρίδα Πολίτη του gov.gr.</p><h3>Τι πρέπει να γνωρίζετε</h3><ul><li><b>Πηγή των θέσεων:</b> Οι κόμβοι του συστήματος παραβίασης ερυθρού σηματοδότη προέρχονται από πίνακα της Διεύθυνσης Τροχαίας Αττικής, όπως δημοσιεύθηκε στον Τύπο. Η τοποθέτησή τους στον χάρτη βασίζεται στις διασταυρώσεις των αντίστοιχων οδών στο OpenStreetMap. Ορισμένες θέσεις είναι κατά προσέγγιση και επισημαίνονται ανάλογα.</li><li><b>Θέση και κατεύθυνση καμερών:</b> Η ακριβής θέση και η κατεύθυνση λήψης κάθε κάμερας ερυθρού σηματοδότη αποτελούν εκτιμήσεις με βάση τα δεδομένα σηματοδότησης του OpenStreetMap και όχι επίσημα στοιχεία.</li><li><b>Κάμερες Τεχνητής Νοημοσύνης:</b> Τα οκτώ σημεία προέρχονται από δημοσιεύματα, καθώς δεν έχει εντοπιστεί δημόσια διαθέσιμος επίσημος κατάλογος με τις ακριβείς θέσεις τους.</li><li><b>Περιορισμοί:</b> Ο χάρτης αποτελεί ανεξάρτητη προσπάθεια ενημέρωσης. Δεν είναι επίσημη πηγή, δεν εγγυάται την πληρότητα ή την ακρίβεια όλων των θέσεων και δεν αποτελεί νομική συμβουλή.</li></ul><h3>Ελεύθερη χρήση</h3><p>Ο χάρτης διατίθεται ελεύθερα. Μπορείτε να τον μοιραστείτε, να τον ενσωματώσετε σε άλλες ιστοσελίδες, να τον αναδημοσιεύσετε ή να αξιοποιήσετε τα δεδομένα και τον κώδικά του, χωρίς κόστος, σύμφωνα με τους όρους των αντίστοιχων αδειών.</p><p>Άδειες χρήσης: Κώδικας: MIT · Δεδομένα OpenStreetMap: ODbL (© συντελεστές του OpenStreetMap) · Κείμενα: CC BY 4.0.</p><p>Διορθώσεις, παρατηρήσεις και προσθήκες είναι ευπρόσδεκτες.</p><h3>Ποιος δημιούργησε τον χάρτη</h3><p>Ιωάννης Τσούρος, συγκοινωνιολόγος, συνεργάτης του Πανεπιστημίου Αιγαίου (<a target=\"_blank\" rel=\"noopener\" href=\"https://transdem.gr\">Εργαστήριο TransDeM</a>) και της <a target=\"_blank\" rel=\"noopener\" href=\"https://mobyx.co\">MobyX</a>.</p><div class=\"icons\" data-icons></div><h3>Πηγές</h3><ul><li><a target=\"_blank\" rel=\"noopener\" href=\"https://www.hellenicparliament.gr/UserFiles/67715b2c-ec81-4f0c-ad6a-476a34d732bd/12807132.pdf\">Απάντηση της Περιφέρειας Αττικής στη Βουλή, 27.12.2024</a></li><li><a target=\"_blank\" rel=\"noopener\" href=\"https://www.naftemporiki.gr/society/2141505/perifereia-attikis-oloklirothike-i-egkatastasi-388-kameron-paraviasis-erythroy-simatodoti/\">Ανακοίνωση της Περιφέρειας για         aboutBody: "<p class=\"lead\">In a democratic society, citizens have a right to know, at the very least, where and when they are under surveillance.</p><p>This map was created to make that information accessible to everyone. It is for people who live and travel in Attica and want to know where cameras have been installed, so that they can stay informed, ask questions, scrutinise how the cameras operate and exercise their rights.</p><p>Its purpose is not to support or reject the use of cameras on the roads, nor to help anyone avoid them. Its purpose is transparency and access to information.</p><h3>Two different systems</h3><p><b>Red-light violation cameras · Attica Region</b><br>The system comprises 388 cameras at 97 signalised junctions, at locations set by the Attica Traffic Police Directorate. According to the Region, the cameras record red-light violations only and send the Traffic Police six photographs and one video per recorded violation, with safeguards so that the occupants cannot be made out. Each camera has a number-plate recognition (ANPR) lens and an overview lens, and the system can recognise the vehicle&rsquo;s number plate, make, colour and category.</p><p><b>Artificial Intelligence cameras · Ministry of Digital Governance and Artificial Intelligence</b><br>This is a pilot system at eight points in Attica. According to the Ministry, the cameras can detect red-light violations, speeding, illegal driving or stopping in bus lanes, failure to wear a seat belt or helmet, and mobile phone use while driving. The resulting fines are sent digitally to the citizen&rsquo;s gov.gr mailbox.</p><h3>What you should know</h3><ul><li><b>Source of the locations:</b> The junctions of the red-light violation system come from a table of the Attica Traffic Police Directorate, as published in the press. Their placement on the map is based on the crossings of the corresponding streets in OpenStreetMap. Some positions are approximate and are marked accordingly.</li><li><b>Camera position and direction:</b> The exact position and viewing direction of each red-light camera are estimates based on OpenStreetMap traffic-signal data, not official data.</li><li><b>Artificial Intelligence cameras:</b> The eight points come from press reports, as no publicly available official list of their exact locations has been found.</li><li><b>Limitations:</b> The map is an independent information effort. It is not an official source, does not guarantee the completeness or accuracy of every location, and is not legal advice.</li></ul><h3>Free to use</h3><p>The map is freely available. You may share it, embed it in other websites, republish it, or use its data and code, at no cost, under the terms of the respective licences.</p><p>Licences: Code: MIT · OpenStreetMap data: ODbL (© OpenStreetMap contributors) · Texts: CC BY 4.0.</p><p>Corrections, comments and additions are welcome.</p><h3>Who made the map</h3><p>Ioannis Tsouros, transport engineer, associate of the University of the Aegean (<a target=\"_blank\" rel=\"noopener\" href=\"https://transdem.gr\">TransDeM Lab</a>) and <a target=\"_blank\" rel=\"noopener\" href=\"https://mobyx.co\">MobyX</a>.</p><div class=\"icons\" data-icons></div><h3>Sources</h3><ul><li><a target=\"_blank\" rel=\"noopener\" href=\"https://www.hellenicparliament.gr/UserFiles/67715b2c-ec81-4f0c-ad6a-476a34d732bd/12807132.pdf\">Attica Region reply to Parliament, 27 Dec 2024 (Greek)</a></li><li><a target=\"_blank\" rel=\"noopener\" href=\"https://www.naftemporiki.gr/society/2141505/perifereia-attikis-oloklirothike-i-egkatastasi-388-kameron-paraviasis-erythroy-simatodoti/\">Region announcement on completed installation, 23 Jul 2026 (Naftemporiki)</a></li><li><a target=\"_blank\" rel=\"noopener\" href=\"https://www.ertnews.gr/wp-content/uploads/2026/03/30-03-26-v3enarksi-vevaiosis-kliseon-fin.pdf\">Joint press release of three ministries, 30 Mar 2026 (Greek)</a></li><li><a target=\"_blank\" rel=\"noopener\" href=\"https://www.       if (id === "water") P(l, "fill-color", c.water);

      else if (/residential/.test(id)) P(l, "fill-color", c.res);
      else if (/aeroway|pier/.test(id)) P(l, "fill-color", c.aero);
    } else if (l.type === "line") {
      if (id === "waterway") P(l, "line-color", c.water);
      else if (/casing/.test(id)) { P(l, "line-color", /motorway/.test(id) ? c.casingMw : c.casing); P(l, "line-opacity", 1); }  // roads drawn as outlined carriageways

      else if (/minor|path|pier/.test(id)) P(l, "line-color", c.minor);
      else if (/rail/.test(id)) P(l, "line-color", c.rail);
      else if (/aeroway/.test(id)) P(l, "line-color", c.aeroLine);
      else if (/boundary/.test(id)) P(l, "line-color", c.boundary);

    }
  });

}

async function init() {

  map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }), "top-right");
  map.addControl(new maplibregl.ScaleControl({ unit: "metric" }), "bottom-right");
  popup = new maplibregl.Popup({ maxWidth: "330px", offset: 14 });
  // phone: a popup is nearly as wide as the screen, so open it upwards and slide the point to where it fits
  popup.on("open", () => { if (isPhone()) map.easeTo({ center: popup.getLngLat(), offset: [0, 110], duration: 350 }); });
  await new Promise(r => map.on("load", r));
  addOverlays();
  syncSheet();

  ["j-dot", "cam-dot", "cone-fill", "ai-dot"].forEach(id => {
    map.on("mouseenter", id, () => map.getCanvas().style.cursor = "pointer");
    map.on("mouseleave", id, () => map.getCanvas().style.cursor = "");
  });
  map.on("click", e => {
    if (FB.picking) {   // the visitor is pointing out where a camera really is
      FB.suggest = [e.lngLat.lat, e.lngLat.lng];
      fbClearMarker();
      FB.marker = new maplibregl.Marker({ color: getComputedStyle(document.documentElement).getPropertyValue("--accent").trim() }).setLngLat(e.lngLat).addTo(map);
      return fbEndPick(true);
    }
    if (!map.getLayer("j-dot")) return;
    const hit = map.queryRenderedFeatures(e.point, { layers: ["ai-dot", "cam-dot", "j-dot", "cone-fill"] })[0];
    if (!hit) return;
    if (hit.layer.id === "ai-dot") return openAi(AI_SITES.find(a => a.id === hit.properties.id));
    if (hit.layer.id === "j-dot") { if (hit.properties.has && map.getZoom() > CAM_ZOOM + .8) return; openJunction(JUNCTIONS.find(j => j.id === hit.properties.id)); }
    else openCamera(cams.find(c => c.id === hit.properties.id));
  });
  map.on("zoom", () => { $("hint").style.opacity = map.getZoom() < CAM_ZOOM ? 1 : 0; });
  const scale = () => {  // representative fraction at 96 dpi, rounded to two significant figures
    const mPerPx = 156543.03 * Math.cos(map.getCenter().lat * Math.PI / 180) / Math.pow(2, map.getZoom() + 1);
    const d = mPerPx * 3779.5, k = Math.pow(10, Math.max(0, Math.floor(Math.log10(d)) - 1));
    $("tbScaleV").textContent = "1:" + (Math.round(d / k) * k).toLocaleString("el-GR");
  };
  map.on("move", scale); scale();
  popup.on("close", () => selectCam(null));
  applyLang();
  render(true);
}

    <tr><td>${t("area")}</td><td>${esc(j.area)}</td></tr>
    <tr><td>${t("flow")}</td><td>${flows}</td></tr>
    <tr><td>${t("cams")}</td><td class="mono"><b>${j.cameras}</b></td></tr></table>
    ${j.approx ? `<div class="note">${t("approx")}</div>` : !j.cams.length ? `<div class="note">${t("nocams")}</div>` : ""}
    <div class="links">${j.cams.length ? `<button class="go" data-zoom="${j.id}">${t("zoomCams")}</button>` : ""}
    <a target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${ll}">${t("gmaps")}</a></div>
    <div class="report"><button data-report="j:${j.id}">${t("report")}</button></div></div>`).addTo(map);
}
function openAi(a) {
  setActive(a);
  popup.options.anchor = isPhone() ? "bottom" : undefined;
  popup.setLngLat([a.lon, a.lat]).setHTML(`<div class="pop"><div class="tag" style="color:${COL.ai}"><i style="background:${COL.ai}"></i>${t("aiPilot")}</div>
    <h3>${esc(a.location)}</h3><table>
    <tr><td>${t("type")}</td><td>${t("aiName")}<div class="sub">${t("aiOwner")}</div></td></tr>
    <tr><td>${t("area")}</td><td>${esc(a.area)}</td></tr>
    <tr><td>${t("records")}</td><td>${t("aiRecords")}</td></tr></table>
    <div class="note">${a.approx ? t("aiApprox") + " " : ""}${t("aiNote")}</div>
    <div class="links"><a target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${a.lat},${a.lon}">${t("gmaps")}</a></div>
    <div class="report"><button data-report="a:${a.id}">${t("report")}</button></div></div>`).addTo(map);
}
function openCamera(c) {
  const j = c.j;
  popup.options.anchor = isPhone() ? "bottom" : undefined;
  setActive(j); selectCam(c);
  popup.setLngLat([c.lon, c.lat]).setHTML(`<div class="pop">${tag(j)}<h3>${t("camera")} ${c.i + 1} ${t("of")} ${j.cams.length} · ${esc(j.location)}</h3><table>
    <tr><td>${t("onRoad")}</td><td>${esc(c.road || t("unnamed"))}</td></tr>
    <tr><td>${t("looks")}</td><td class="mono">${compass(c.hdg)} · ${c.hdg}°</td></tr>
    <tr><td>${t("records")}</td><td>${t("redRecords")}</td></tr>
    <tr><td>${t("node")}</td><td class="mono">${j.node}</td></tr></table>
    <div class="note">${t(c.src === "signal" ? "estSignal" : "estRoad")}</div>
    <div class="links"><button class="go" data-pov="${c.id}">${t("pov")}</button>
    <a target="_blank" rel="noopener" href="https://www.google.com/maps/@?api=1&map_action=pano&viewpoint=${c.lat},${c.lon}&heading=${c.hdg}&pitch=-5&fov=80">${t("sv")}</a></div>
    <div class="report"><button data-report="c:${c.id}">${t("report")}</button></div></div>`).addTo(map);
  selectCam(c);
}
// ---- feedback: general comments and per-point error reports, sent to /api/feedback (which files a GitHub issue)
const FB = { target: null, suggest: null, picking: false, marker: null };
function fbTargetFrom(code) {
  const [k, id] = code.split(":");
  if (k === "j") { const j = JUNCTIONS.find(x => x.id == id); return { label: `Κ${j.node} · ${j.location}`, ref: `red:${j.node}`, lat: j.lat, lon: j.lon }; }
  if (k === "a") { const a = AI_SITES.find(x => x.id == id); return { label: `AI · ${a.location}`, ref: `ai:${a.id}`, lat: a.lat, lon: a.lon }; }
  const c = cams.find(x => x.id == id);
  return { label: `Κ${c.j.node} · ${c.j.location} · ${t("cam")} ${c.i + 1}/${c.j.cams.length}`, ref: `red:${c.j.node}:${c.i + 1}`, lat: c.lat, lon: c.lon };
}
function fbSuggestRow() {
  $("fbPickBtn").textContent = t(FB.suggest ? "pickAgain" : "pickBtn");
  $("fbPickVal").textContent = FB.suggest ? `${t("picked")}: ${FB.suggest[0].toFixed(5)}, ${FB.suggest[1].toFixed(5)}` : "";
}
function fbClearMarker() { if (FB.marker) { FB.marker.remove(); FB.marker = null; } }
function openFeedback(target) {
  FB.target = target || null; FB.suggest = null; fbClearMarker();
  $("fbTitle").textContent = t(target ? "fbTitlePoint" : "fbTitleGen");
  $("fbTarget").style.display = target ? "" : "none";
  if (target) $("fbTarget").innerHTML = `<small>${t("fbFor")}</small>${esc(target.label)}`;
  $("fbIssue").style.display = $("fbPick").style.display = target ? "" : "none";
  $("fbIssue").innerHTML = [["position", "isPosition"], ["missing", "isMissing"], ["details", "isDetails"], ["other", "isOther"]].map(([v, k], i) =>
    `<label class="opt"><input type="radio" name="issue" value="${v}"${i ? "" : " checked"}>${t(k)}</label>`).join("");
  $("fbMsg").value = ""; $("fbMsg").placeholder = t(target ? "fbMsgPoint" : "fbMsgGen");
  $("fbHp").value = ""; $("fbStatus").textContent = ""; $("fbSend").disabled = false; $("fbSend").style.display = "";
  fbSuggestRow();
  if (popup) popup.remove();
  $("fb").showModal();
}
function fbStartPick() {
  FB.picking = true; $("fb").close(); document.body.classList.add("picking");
  map.getCanvas().style.cursor = "crosshair";
  if (isPhone()) setSheet(false);
}
function fbEndPick(reopen) {
  FB.picking = false; document.body.classList.remove("picking"); map.getCanvas().style.cursor = "";
  if (reopen) { fbSuggestRow(); $("fb").showModal(); }
}
function fbPayload() {
  const issue = (document.querySelector('#fbIssue input:checked') || {}).value || "other";
  const p = { type: FB.target ? "point" : "general", message: $("fbMsg").value.trim(), website: $("fbHp").value, lang };
  if (FB.target) Object.assign(p, { label: FB.target.label, ref: FB.target.ref, lat: FB.target.lat, lon: FB.target.lon, issue });
  if (FB.suggest) Object.assign(p, { suggestLat: FB.suggest[0], suggestLon: FB.suggest[1] });
  return p;
}
function fbFallbackLink(p) {   // if the server cannot take the report, offer a pre-filled GitHub issue instead
  const lines = [p.label ? `${p.label} (${p.ref})` : "", p.issue ? `Πρόβλημα: ${p.issue}` : "", p.lat ? `Θέση: ${p.lat}, ${p.lon}` : "",
    p.suggestLat ? `Προτεινόμενη θέση: ${p.suggestLat.toFixed(6)}, ${p.suggestLon.toFixed(6)}` : "", "", p.message].filter((x, i) => x || i === 4).join("\n");
  return "https://github.com/acesonic7/traffic-cameras-attica/issues/new?title=" + encodeURIComponent((p.type === "point" ? "[Αναφορά] " + p.label : "[Σχόλιο]").slice(0, 120)) + "&body=" + encodeURIComponent(lines);
}
$("fbForm").addEventListener("submit", async e => {
  e.preventDefault();
  const p = fbPayload(), st = $("fbStatus");
  if (p.message.length < 5 && !FB.suggest && !(FB.target && p.issue === "missing")) { st.textContent = t("fbEmpty"); return; }
  $("fbSend").disabled = true; st.textContent = t("fbSending");
  let code = 0;
  try { const r = await fetch("/api/feedback", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(p) }); code = r.status; } catch (err) {}
  if (code === 200) { st.textContent = t("fbThanks"); $("fbSend").style.display = "none"; fbClearMarker(); return; }
  $("fbSend").disabled = false;
  if (code === 429) { st.textContent = t("fbRate"); return; }
  st.innerHTML = `${t("fbFail")} <a target="_blank" rel="noopener" href="${fbFallbackLink(p)}">${t("fbFallback")}</a>`;
});
$("fbBtn").addEventListener("click", () => openFeedback(null));
$("fbPickBtn").addEventListener("click", fbStartPick);
$("pickCancel").addEventListener("click", () => fbEndPick(true));
["fbClose", "fbCancel"].forEach(id => $(id).addEventListener("click", () => { $("fb").close(); fbClearMarker(); }));
$("fb").addEventListener("click", e => { if (e.target === $("fb")) { $("fb").close(); fbClearMarker(); } });
document.addEventListener("keydown", e => { if (e.key === "Escape" && FB.picking) fbEndPick(true); });

document.addEventListener("click", e => {
  const rp = e.target.closest("[data-report]");
  if (rp) return openFeedback(fbTargetFrom(rp.dataset.report));
  const z = e.target.closest("[data-zoom]"), p = e.target.closest("[data-pov]");
  if (z) { const j = JUNCTIONS.find(x => x.id == z.dataset.zoom); popup.remove(); map.flyTo({ center: [j.lon, j.lat], zoom: 18, pitch: 45, speed: 1.4 }); }
  if (p) { // schematic point of view: sit behind the camera, look along its heading over the 3D buildings
    const c = cams.find(x => x.id == p.dataset.pov); popup.remove(); selectCam(c);
    map.flyTo({ center: offset(c.lat, c.lon, c.hdg, 28), zoom: 19.4, pitch: 76, bearing: c.hdg, speed: 1.2 });
  }
});

// ---- list + filters
let activeId = null;
function setActive(j) {
  activeId = j.id;
  document.querySelectorAll(".item").forEach(el => el.classList.toggle("active", el.dataset.id == j.id));
  const el = document.querySelector(`.item[data-id="${j.id}"]`);
  if (el) el.scrollIntoView({ block: "nearest" });
}
function current() {
  const q = norm($("q").value.trim()).split(/\s+/).filter(Boolean);
  const area = $("area").value, sort = $("sort").value;
  const rows = JUNCTIONS.filter(j => layersOn.red && active[j.coverage] && (!area || j.area === area) && q.every(w => j.key.includes(w)));
  if (sort === "cams") rows.sort((a, b) => b.cameras - a.cameras || a.aa[0] - b.aa[0]);
  else if (sort === "name") rows.sort((a, b) => norm(a.location).localeCompare(norm(b.location), "el"));
  else rows.sort((a, b) => a.aa[0] - b.aa[0]);
  return rows;
}
function currentAi() {
  const q = norm($("q").value.trim()).split(/\s+/).filter(Boolean), area = $("area").value;
  return AI_SITES.filter(a => layersOn.ai && (!area || a.area === area) && q.every(w => a.key.includes(w)));
}
function render(fit) {
  const rows = current(), ai = currentAi();
  map.getSource("ai").setData(aiGeo(ai));
  map.getSource("junctions").setData(jGeo(rows));
  map.getSource("cams").setData(cGeo(rows));
  map.getSource("cones").setData(coneGeo(rows));
  $("nJ").textContent = new Set([...rows, ...ai].map(r => r.lat.toFixed(4) + "," + r.lon.toFixed(4))).size;
  $("nC").textContent = rows.reduce((s, j) => s + j.cameras, 0);
  $("nA").textContent = new Set([...rows, ...ai].map(j => j.area)).size;
  $("tbCamsV").textContent = JUNCTIONS.reduce((n, j) => n + j.cameras, 0) + " + " + AI_SITES.length + " " + t("aiUnit");
  const aiItems = ai.map(a => `
    <button class="item${a.id === activeId ? " active" : ""}${a.approx ? " approx" : ""}" data-id="${a.id}">
      <span class="id" style="color:${COL.ai}"><i class="sq"></i>${t("aiUnit")}</span>
      <span><div class="name">${esc(a.location)}</div>
      <div class="meta">${esc(a.area)} · ${t("aiPilot")}</div></span>
      <span class="n" style="color:${COL.ai}">–</span>
    </button>`).join("");
  $("list").innerHTML = rows.length + ai.length ? aiItems + rows.map(j => `
    <button class="item${j.id === activeId ? " active" : ""}${j.approx ? " approx" : ""}" data-id="${j.id}">
      <span class="id"><i style="color:${COL[j.kind]}"></i>Κ${j.node}</span>
      <span><div class="name">${esc(j.location)}</div>
      <div class="meta">${esc(j.area)} · ${t(j.coverage)}</div></span>
      <span class="n">${j.cameras}</span>
    </button>`).join("") : `<div class="empty">${t("none")}</div>`;
  if (fit && rows.length + ai.length) {
    const b = new maplibregl.LngLatBounds();
    [...rows, ...ai].forEach(j => b.extend([j.lon, j.lat]));
    map.fitBounds(b, { padding: isPhone() ? 28 : 70, maxZoom: 16.5, pitch: 0, bearing: 0, duration: 700 });
  }
}
$("list").addEventListener("click", e => {
  const el = e.target.closest(".item"); if (!el) return;
  const j = findRow(el.dataset.id);
  popup.remove(); setActive(j);
  if (isPhone()) setSheet(false);   // close the sheet first so the junction lands in the visible part of the map
  map.flyTo({ center: [j.lon, j.lat], zoom: j.cams.length ? 17.6 : 16, pitch: isPhone() ? 0 : 40, speed: 1.6 });
  if (!j.cams.length) map.once("moveend", () => j.ai ? openAi(j) : openJunction(j));
});
// ---- filters live behind a toggle so the list gets the room; the button shows how many are in effect
const FILTER_ICON = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M2 4h12M4.5 8h7M7 12h2"/></svg>';
function filterCount() {
  return Object.values(layersOn).filter(v => !v).length + (layersOn.red ? Object.values(active).filter(v => !v).length : 0) + ($("area").value ? 1 : 0);
}
function syncFilterButton() {
  const n = filterCount(), open = !$("fPanel").hidden;
  $("fToggle").innerHTML = `${FILTER_ICON}${t("filters")}${n ? ` <b>${n}</b>` : ""}`;
  $("fToggle").classList.toggle("active", n > 0 || open);
  $("fToggle").setAttribute("aria-expanded", open);
  $("fReset").style.display = n ? "" : "none";
}
$("fToggle").addEventListener("click", () => { $("fPanel").hidden = !$("fPanel").hidden; syncFilterButton(); syncSheet(); });
$("fReset").addEventListener("click", () => {
  Object.keys(layersOn).forEach(k => layersOn[k] = true); Object.keys(active).forEach(k => active[k] = true);
  $("area").value = ""; applyLang(); render(true);
});
$("q").addEventListener("input", () => render(true));
$("area").addEventListener("change", () => { syncFilterButton(); render(true); });
$("sort").addEventListener("change", () => render(false));
$("aboutBtn").addEventListener("click", () => $("about").showModal());
$("aboutClose").addEventListener("click", () => $("about").close());
$("about").addEventListener("click", e => { if (e.target === $("about")) $("about").close(); });
// ---- phone: bottom sheet. The map is told how much of the screen the sheet covers, so fits and fly-tos stay in view
const isPhone = () => window.innerWidth <= 760;
function syncSheet() {
  const h = isPhone() ? $("side").offsetHeight : 0;
  document.documentElement.style.setProperty("--sheet", h + "px");
  if (map) map.setPadding({ top: 0, left: 0, right: 0, bottom: h });
}
function setSheet(open) {
  $("side").classList.toggle("collapsed", !open);
  $("toggle").textContent = open ? "▾" : "▴";
  $("toggle").setAttribute("aria-expanded", open);
  syncSheet();
}
$("head").addEventListener("click", e => {
  if (!isPhone() || e.target.closest("#theme, #lang")) return;
  setSheet($("side").classList.contains("collapsed"));
});
let wasPhone = isPhone();
window.addEventListener("resize", () => {
  if (isPhone() !== wasPhone) { wasPhone = isPhone(); setSheet(!wasPhone); }
  syncSheet();
});
if (isPhone()) setSheet(false);
$("chips").addEventListener("click", e => {
  const c = e.target.closest(".chip"); if (!c) return;
  active[c.dataset.k] = !active[c.dataset.k]; applyLang();
});
$("layers").addEventListener("click", e => {
  const c = e.target.closest(".chip"); if (!c) return;
  layersOn[c.dataset.k] = !layersOn[c.dataset.k]; applyLang(); render(true);
});
$("reset").addEventListener("click", () => { popup.remove(); render(true); });

function applyLang() {
  document.documentElement.lang = lang;
  document.title = t("title") + " · " + (lang === "el" ? "Αττική" : "Attica");
  document.querySelectorAll("[data-t]").forEach(el => el.textContent = t(el.dataset.t));
  $("q").placeholder = t("search");
  $("theme").setAttribute("aria-label", t("thLabel"));
  $("theme").innerHTML = [["light", "thLight"], ["dark", "thDark"], ["auto", "thAuto"]].map(([v, k]) =>
    `<button data-v="${v}" aria-pressed="${themePref === v}" title="${t(k)}" aria-label="${t(k)}">${ICON[v]}</button>`).join("");
  $("footIcons").innerHTML = iconLinks(["github"]);
  $("aboutBody").innerHTML = t("aboutBody");
  $("aboutBody").querySelectorAll("[data-icons]").forEach(el => el.innerHTML = iconLinks());
  ["lang:other", "reset:reset", "hint:hint"].forEach(p => { const [id, k] = p.split(":"); $(id).textContent = t(k); });
  const a = $("area").value, s = $("sort").value || "aa";
  const areas = [...new Set([...JUNCTIONS, ...AI_SITES].map(j => j.area))].sort((x, y) => x.localeCompare(y, "el"));
  $("area").innerHTML = `<option value="">${t("allAreas")}</option>` + areas.map(x => `<option>${esc(x)}</option>`).join("");
  $("area").value = a;
  $("sort").innerHTML = `<option value="aa">${t("sortAA")}</option><option value="cams">${t("sortCams")}</option><option value="name">${t("sortName")}</option>`;
  $("sort").value = s;
  $("layers").innerHTML = [["red", "redName", "var(--ink)"], ["ai", "aiName", COL.ai]].map(([k, name, col]) =>
    `<button class="chip${layersOn[k] ? " on" : ""}" data-k="${k}" aria-pressed="${layersOn[k]}"><i style="color:${col}"></i>${t(name)}</button>`).join("");
  $("chips").style.display = layersOn.red ? "" : "none";
  $("chips").innerHTML = ["all", "both", "one"].map(k =>
    `<button class="chip${active[k] ? " on" : ""}" data-k="${k}" aria-pressed="${active[k]}"><i style="color:${COL[k]}"></i>${t(k)}</button>`).join("");
  syncFilterButton();
  if (popup) popup.remove();
  if (map && map.getSource("junctions")) render(false);
}
$("lang").addEventListener("click", () => { lang = lang === "el" ? "en" : "el"; try { localStorage.setItem("lang", lang); } catch (e) {} applyLang(); });
applyLang();
init();
</script>
</body>
</html>
