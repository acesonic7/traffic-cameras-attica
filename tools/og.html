<!DOCTYPE html>
<!-- Social preview card (1200x630). Rendered to ../og.png by render_og.mjs. -->
<html lang="el">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
  :root { --bg: #0b1220; --panel: #0f1828; --ink: #e8eef7; --muted: #8a9bb3; --line: #1f2c42; --rule: #40527a;
          --all: #ff5a4f; --both: #ffb020; --one: #3ddc97; --ai: #b48cff; --grid: rgba(127, 178, 255, .07); }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { width: 1200px; height: 630px; background: var(--bg); color: var(--ink); font: 20px/1.35 "IBM Plex Sans", sans-serif; position: relative; overflow: hidden; }
  .mono { font-family: "IBM Plex Mono", monospace; font-variant-numeric: tabular-nums; }
  #sheet { position: absolute; inset: 24px; border: 2px solid var(--rule); display: grid; grid-template-columns: 590px 1fr; }
  #side { background: var(--panel); border-right: 2px solid var(--rule); padding: 40px 40px 34px; display: flex; flex-direction: column; }
  .eyebrow { font: 600 17px "IBM Plex Mono", monospace; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; gap: 14px; }
  .lights { display: inline-flex; gap: 6px; padding: 6px 8px; border: 1.5px solid var(--rule); }
  .lights i { width: 12px; height: 12px; border-radius: 50%; }
  h1 { font-size: 51px; line-height: 1.1; font-weight: 700; letter-spacing: -.012em; margin: 30px 0 0; }
  .sub { color: var(--muted); font-size: 22px; margin-top: 18px; }
  .stats { margin-top: auto; display: grid; grid-template-columns: repeat(3, auto); justify-content: start; gap: 0; border-top: 1.5px solid var(--rule); padding-top: 20px; }
  .stat { padding-right: 30px; margin-right: 30px; border-right: 1px solid var(--line); }
  .stat:last-child { border: 0; margin: 0; padding: 0; }
  .stat b { display: block; font: 600 46px/1 "IBM Plex Mono", monospace; }
  .stat span { display: block; margin-top: 8px; font: 500 14px "IBM Plex Mono", monospace; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  #plan { position: relative; background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px); background-size: 40px 40px; }
  #plan svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .legend { position: absolute; left: 22px; bottom: 18px; display: flex; gap: 20px; font: 500 14px "IBM Plex Mono", monospace; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .legend i { display: inline-block; width: 11px; height: 11px; border-radius: 50%; margin-right: 8px; }
  .north { position: absolute; right: 22px; top: 18px; font: 600 14px "IBM Plex Mono", monospace; color: var(--muted); letter-spacing: .1em; }
</style>
</head>
<body>
<div id="sheet">
  <div id="side">
    <div class="eyebrow"><span class="lights"><i style="background:var(--all)"></i><i style="background:var(--both)"></i><i style="background:var(--one)"></i></span>Ανοιχτά δεδομένα · Αττική</div>
    <h1>Κάμερες ερυθρού σηματοδότη και Τεχνητής Νοημοσύνης</h1>
    <div class="sub">Open map of red-light and AI traffic cameras in Attica, Greece</div>
    <div class="stats">
      <div class="stat"><b id="nJ"></b><span>σημεία</span></div>
      <div class="stat"><b id="nC"></b><span>κάμερες ερυθρού</span></div>
      <div class="stat"><b id="nA" style="color:var(--ai)"></b><span>κάμερες AI</span></div>
    </div>
  </div>
  <div id="plan">
    <svg id="svg"></svg>
    <div class="north">Β ↑</div>
    <div class="legend"><span><i style="background:var(--all);margin-right:4px"></i><i style="background:var(--both);margin-right:4px"></i><i style="background:var(--one)"></i>Ερυθρού</span><span><i style="background:var(--ai)"></i>AI</span></div>
  </div>
</div>
<script src="../data.js"></script>
<script>
  document.getElementById("nJ").textContent = JUNCTIONS.length;
  document.getElementById("nC").textContent = JUNCTIONS.reduce((s, j) => s + j.cameras, 0);
  document.getElementById("nA").textContent = AI_SITES.length;
  // plot every point on a plain equirectangular sheet, fitted to the panel
  const svg = document.getElementById("svg"), W = svg.clientWidth, H = svg.clientHeight, pad = 54;
  const pts = [...JUNCTIONS.map(j => ({ ...j, c: `var(--${j.coverage})`, r: 3.5 + Math.sqrt(j.cameras) * 1.9 })), ...AI_SITES.map(a => ({ ...a, c: "var(--ai)", r: 7, ai: 1 }))];
  const k = Math.cos(38 * Math.PI / 180), xs = pts.map(p => p.lon * k), ys = pts.map(p => p.lat);
  const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
  const s = Math.min((W - 2 * pad) / (x1 - x0), (H - 2 * pad - 20) / (y1 - y0));
  const ox = (W - (x1 - x0) * s) / 2, oy = (H - 20 - (y1 - y0) * s) / 2;
  svg.innerHTML = pts.sort((a, b) => b.r - a.r).map(p => {
    const x = ox + (p.lon * k - x0) * s, y = oy + (y1 - p.lat) * s;
    return `<circle cx="${x}" cy="${y}" r="${p.r * 2.2}" fill="${p.c}" opacity=".13"/><circle cx="${x}" cy="${y}" r="${p.r}" fill="${p.c}" stroke="#0b1220" stroke-width="1.5"${p.ai ? ' opacity=".95"' : ""}/>`;
  }).join("");
</script>
</body>
</html>
